apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "classify-app.fullname" . }}
  labels:
    {{- include "classify-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Recreate, not RollingUpdate: images/model/trainingdata are ReadWriteOnce PVCs, a rolling
  # update would try to start the new pod before releasing the old one's volumes and deadlock.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "classify-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        {{- include "classify-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
    spec:
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Seeds the model PVC and the trainingdata PVC from the copies baked into this same
        # image. The model files are seeded once (skipped if already present, so the PVC stays
        # the persistent source of truth). The sample images use cp -n instead, so new samples
        # added in a later image update still get picked up without disturbing files a previous
        # boot already seeded (or that were otherwise touched since).
        - name: seed-model
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -e
              if [ ! -f /models/model/model.onnx ]; then
                cp /app/model.onnx /models/model/model.onnx
              fi
              if [ ! -f /models/model/model.onnx.data ]; then
                cp /app/model.onnx.data /models/model/model.onnx.data
              fi
              for f in /app/samples/*; do
                case "$f" in
                  *.md) continue ;;
                esac
                cp -n "$f" /data/trainingdata/ 2>/dev/null || true
              done
          volumeMounts:
            - name: model
              mountPath: /models/model
            - name: trainingdata
              mountPath: /data/trainingdata
      containers:
        - name: classify-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: IMAGES_DIR
              value: /data/images
            - name: MODEL_DIR
              value: /models/model
            - name: TRAININGDATA_DIR
              value: /data/trainingdata
            - name: POSTGRES_HOST
              value: {{ include "classify-app.fullname" . }}-postgres
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CLUSTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "classify-app.fullname" . }}-config
                  key: CLUSTER_NAME
          envFrom:
            - secretRef:
                name: {{ include "classify-app.fullname" . }}-postgres
          resources:
            {{- toYaml .Values.resources.app | nindent 12 }}
          volumeMounts:
            - name: images
              mountPath: /data/images
            - name: model
              mountPath: /models/model
            - name: trainingdata
              mountPath: /data/trainingdata
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: images
          persistentVolumeClaim:
            claimName: {{ include "classify-app.fullname" . }}-images
        - name: model
          persistentVolumeClaim:
            claimName: {{ include "classify-app.fullname" . }}-model
        - name: trainingdata
          persistentVolumeClaim:
            claimName: {{ include "classify-app.fullname" . }}-trainingdata

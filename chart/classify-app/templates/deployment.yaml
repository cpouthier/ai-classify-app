apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "classify-app.fullname" . }}
  labels:
    {{- include "classify-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Recreate, not RollingUpdate: images/model/weights are ReadWriteOnce PVCs, a rolling update
  # would try to start the new pod before releasing the old one's volumes and deadlock.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "classify-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        {{- include "classify-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
    spec:
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Seeds the model/weights PVCs from the copy baked into this same image, only on first
        # boot (no-op once the PVCs already hold the files). This is what makes the model graph
        # and its trained weights persistent data instead of something that just comes back for
        # free every time the image is pulled.
        - name: seed-model
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -e
              if [ ! -f /models/model/model.onnx ]; then
                cp /app/model.onnx /models/model/model.onnx
              fi
              if [ ! -f /models/weight/model.onnx.data ]; then
                cp /app/model.onnx.data /models/weight/model.onnx.data
              fi
              cp /models/weight/model.onnx.data /models/model/model.onnx.data
          volumeMounts:
            - name: model
              mountPath: /models/model
            - name: weights
              mountPath: /models/weight
      containers:
        - name: classify-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: IMAGES_DIR
              value: /data/images
            - name: MODEL_DIR
              value: /models/model
            - name: POSTGRES_HOST
              value: {{ include "classify-app.fullname" . }}-postgres
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CLUSTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "classify-app.fullname" . }}-config
                  key: CLUSTER_NAME
          envFrom:
            - secretRef:
                name: {{ include "classify-app.fullname" . }}-postgres
          resources:
            {{- toYaml .Values.resources.app | nindent 12 }}
          volumeMounts:
            - name: images
              mountPath: /data/images
            - name: model
              mountPath: /models/model
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: images
          persistentVolumeClaim:
            claimName: {{ include "classify-app.fullname" . }}-images
        - name: model
          persistentVolumeClaim:
            claimName: {{ include "classify-app.fullname" . }}-model
        - name: weights
          persistentVolumeClaim:
            claimName: {{ include "classify-app.fullname" . }}-weights

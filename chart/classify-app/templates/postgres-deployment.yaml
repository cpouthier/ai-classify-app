apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "classify-app.fullname" . }}-postgres
  labels:
    {{- include "classify-app.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the PVC below is ReadWriteOnce, a rolling update would try to
  # start the new pod before releasing the old one's volume and deadlock.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "classify-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "classify-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: {{ include "classify-app.fullname" . }}-postgres
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            {{- toYaml .Values.resources.postgres | nindent 12 }}
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)"]
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: {{ include "classify-app.fullname" . }}-postgres

# Helm values for the open-webui chart (https://helm.openwebui.com), which bundles an
# ollama sub-chart. Written for cluster1 (Puls8 production side, StorageClass sc-prod).
#
# Field names below match the open-webui chart as of its recent releases. Chart values do
# drift between versions, run `helm show values open-webui/open-webui` after adding the repo
# and diff against this file before installing if you are on a different chart version.
#
# Model pulling and knowledge base upload are intentionally NOT done here (no
# ollama.ollama.models.pull list): they are handled by the init Job in init/job-init.yaml
# via the Ollama and Open WebUI APIs, per the demo runbook.

replicaCount: 1

# 384Mi/768Mi got OOMKilled at startup in testing, Open WebUI's bundled Python/ML stack
# (torch, sentence-transformers for RAG embeddings, etc) needs more headroom than that even
# idle. 512Mi/2Gi held steady around 670Mi actual usage.
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi

tolerations: &tolerations
  - key: node.kubernetes.io/not-ready
    operator: Exists
    effect: NoExecute
    tolerationSeconds: 30
  - key: node.kubernetes.io/unreachable
    operator: Exists
    effect: NoExecute
    tolerationSeconds: 30

persistence:
  enabled: true
  size: 2Gi
  storageClass: sc-prod

# LoadBalancer so the demo UI gets a routable IP straight from the cluster's LB implementation
# (MetalLB on-prem, a cloud LB otherwise) instead of needing kubectl port-forward.
service:
  type: LoadBalancer

# Disable Open WebUI's bundled Postgres/pgvector if the chart offers one, we run our own
# pgvector instance under postgres/ so both apps share a single, backed-up database.
pgvector:
  enabled: false

extraEnvVars:
  - name: VECTOR_DB
    value: pgvector
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: webui-db-credentials
        key: DATABASE_URL
  - name: PGVECTOR_DB_URL
    valueFrom:
      secretKeyRef:
        name: webui-db-credentials
        key: PGVECTOR_DB_URL
  - name: ENABLE_SIGNUP
    value: "true"
  - name: WEBUI_AUTH
    value: "true"

ollama:
  enabled: true
  ollama:
    gpu:
      enabled: false
  persistentVolume:
    enabled: true
    size: 5Gi
    storageClass: sc-prod
  resources:
    requests:
      cpu: 500m
      memory: 1536Mi
    limits:
      cpu: "2"
      memory: 3Gi
  tolerations: *tolerations
  extraEnvVars:
    - name: OLLAMA_NUM_PARALLEL
      value: "1"
    - name: OLLAMA_MAX_LOADED_MODELS
      value: "1"

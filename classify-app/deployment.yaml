apiVersion: apps/v1
kind: Deployment
metadata:
  name: classify-app
  namespace: ai-demo
  labels:
    app: classify-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: classify-app
  template:
    metadata:
      labels:
        app: classify-app
    spec:
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      initContainers:
        # Seeds ai-model / ai-trained-weight from the copy of the model baked into this same
        # image, only on first boot (no-op once the PVCs already hold the files). This is what
        # makes the model graph and its trained weights persistent, backed-up data instead of
        # something that just comes back for free every time the image is pulled.
        - name: seed-model
          image: docker.io/cpouthier/ai-image-classify:latest
          command:
            - sh
            - -c
            - |
              set -e
              if [ ! -f /models/model/model.onnx ]; then
                cp /app/model.onnx /models/model/model.onnx
              fi
              if [ ! -f /models/weight/model.onnx.data ]; then
                cp /app/model.onnx.data /models/weight/model.onnx.data
              fi
              cp /models/weight/model.onnx.data /models/model/model.onnx.data
          volumeMounts:
            - name: ai-model
              mountPath: /models/model
            - name: ai-trained-weight
              mountPath: /models/weight
      containers:
        - name: classify-app
          image: docker.io/cpouthier/ai-image-classify:latest
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: IMAGES_DIR
              value: /data/images
            - name: MODEL_DIR
              value: /models/model
            - name: POSTGRES_HOST
              value: postgres
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CLUSTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: cluster-config
                  key: CLUSTER_NAME
          envFrom:
            - secretRef:
                name: postgres-credentials
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: images-data
              mountPath: /data/images
            - name: ai-model
              mountPath: /models/model
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: images-data
          persistentVolumeClaim:
            claimName: images-data
        - name: ai-model
          persistentVolumeClaim:
            claimName: ai-model
        - name: ai-trained-weight
          persistentVolumeClaim:
            claimName: ai-trained-weight

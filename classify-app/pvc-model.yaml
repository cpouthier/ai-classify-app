# The ONNX model graph (architecture), seeded from the image by classify-app's initContainer
# on first boot. Small, but backed up like any other important data, that's the point.
# Sized to also hold a copy of model.onnx.data (see the seed-model initContainer): onnxruntime
# expects the graph and its external weights file in the same directory, so the weights get
# copied here too alongside the ai-trained-weight PVC that owns them.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-model
  namespace: ai-demo
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: sc-prod
  resources:
    requests:
      storage: 300Mi

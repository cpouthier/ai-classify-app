# The ONNX model's trained weights (external data file), seeded from the image by
# classify-app's initContainer on first boot. Small, but backed up like any other important
# data, that's the point: the model is useless without them.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-trained-weight
  namespace: ai-demo
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: sc-prod
  resources:
    requests:
      storage: 200Mi

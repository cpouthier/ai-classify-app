<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Puls8 BC/DR image classification demo</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    align-items: center;
    padding: 16px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
  }
  header .cluster-name {
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--accent);
  }
  header .stat { font-size: 0.9rem; color: var(--muted); }
  header .stat strong { color: var(--text); }
  main { padding: 24px; }
  #dropzone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 40px;
    text-align: center;
    color: var(--muted);
    cursor: pointer;
    margin-bottom: 24px;
  }
  #dropzone.dragover { border-color: var(--accent); color: var(--accent); }
  #fileInput { display: none; }
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .card img {
    width: 100%;
    height: 160px;
    object-fit: cover;
    display: block;
    background: #000;
  }
  .card .body { padding: 10px 12px; }
  .card .label { font-weight: 600; }
  .card .confidence { color: var(--accent); font-size: 0.85rem; }
  .card .meta { color: var(--muted); font-size: 0.75rem; margin-top: 6px; line-height: 1.4; }
</style>
</head>
<body>
<header>
  <div class="cluster-name" id="clusterName">-</div>
  <div class="stat">Pod: <strong id="podName">-</strong></div>
  <div class="stat">Node: <strong id="nodeName">-</strong></div>
  <div class="stat">Total images: <strong id="totalImages">0</strong></div>
  <div class="stat">Last #: <strong id="lastSequenceId">0</strong></div>
</header>
<main>
  <div id="dropzone">
    Drag &amp; drop images here, or click to choose files
    <input id="fileInput" type="file" multiple accept="image/*" />
  </div>
  <div id="grid"></div>
</main>
<script>
  const dropzone = document.getElementById("dropzone");
  const fileInput = document.getElementById("fileInput");
  const grid = document.getElementById("grid");

  dropzone.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => uploadFiles(fileInput.files));

  ["dragenter", "dragover"].forEach((evt) =>
    dropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropzone.classList.add("dragover");
    })
  );
  ["dragleave", "drop"].forEach((evt) =>
    dropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropzone.classList.remove("dragover");
    })
  );
  dropzone.addEventListener("drop", (e) => uploadFiles(e.dataTransfer.files));

  async function uploadFiles(fileList) {
    if (!fileList || fileList.length === 0) return;
    const formData = new FormData();
    for (const file of fileList) formData.append("files", file);
    await fetch("/upload", { method: "POST", body: formData });
    refresh();
  }

  function shortUuid(id) {
    return id ? id.slice(0, 8) : "";
  }

  function formatTimestamp(iso) {
    const date = new Date(iso);
    return date.toLocaleString();
  }

  function renderCard(row) {
    const card = document.createElement("div");
    card.className = "card";
    const confidencePct = (row.confidence * 100).toFixed(1);
    card.innerHTML = `
      <img src="/image/${row.uuid}" alt="${row.filename}" loading="lazy" />
      <div class="body">
        <div class="label">${row.label}</div>
        <div class="confidence">${confidencePct}% confidence</div>
        <div class="meta">
          #${row.sequence_id} &middot; ${shortUuid(row.uuid)}<br/>
          ${formatTimestamp(row.created_at)}<br/>
          pod ${row.pod_name} &middot; node ${row.node_name}
        </div>
      </div>
    `;
    return card;
  }

  async function refresh() {
    try {
      const [metaRes, resultsRes] = await Promise.all([
        fetch("/meta"),
        fetch("/results"),
      ]);
      const meta = await metaRes.json();
      const results = await resultsRes.json();

      document.getElementById("clusterName").textContent = meta.cluster_name;
      document.getElementById("podName").textContent = meta.pod_name;
      document.getElementById("nodeName").textContent = meta.node_name;
      document.getElementById("totalImages").textContent = meta.total_images;
      document.getElementById("lastSequenceId").textContent = meta.last_sequence_id;

      grid.innerHTML = "";
      for (const row of results) grid.appendChild(renderCard(row));
    } catch (err) {
      console.error("refresh failed", err);
    }
  }

  refresh();
  setInterval(refresh, 3000);
</script>
</body>
</html>

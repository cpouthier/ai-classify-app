apiVersion: config.kio.kasten.io/v1alpha1
kind: BlueprintBinding
metadata:
  name: ai-demo-postgres-binding
  namespace: kasten-io
spec:
  blueprintRef:
    name: ai-demo-postgres-blueprint
    namespace: kasten-io
  resources:
    matchAll:
      - type:
          operator: In
          values:
            - group: apps
              version: v1
              resource: deployments
              name: postgres
      - namespace:
          operator: In
          values:
            - ai-demo

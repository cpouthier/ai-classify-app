# Applied on cluster2 (the DR cluster) and selected during the DR restore/import so that
# every restored PVC lands on sc-dr instead of the original sc-prod, and the cluster-config
# ConfigMap's CLUSTER_NAME reflects cluster2 instead of the value it had on cluster1.
apiVersion: config.kio.kasten.io/v1alpha1
kind: TransformSet
metadata:
  name: sc-prod-to-sc-dr
  namespace: kasten-io
spec:
  comment: "Rewrite storage class and CLUSTER_NAME from cluster1/sc-prod to cluster2/sc-dr on DR restore"
  transforms:
    - subject:
        resource: persistentvolumeclaims
        group: ""
        version: v1
      json:
        - op: replace
          path: /spec/storageClassName
          value: sc-dr
    - subject:
        resource: configmaps
        group: ""
        version: v1
      json:
        - op: add
          path: /data/CLUSTER_NAME
          value: REPLACE_ME_DR_CLUSTER_NAME
